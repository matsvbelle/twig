# Pushing a vX.Y.Z tag publishes a GitHub release with the asset `twig update` downloads.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $version"; exit 1; }

      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add "$TARGET"

      - run: cargo test

      - name: Build
        run: |
          cargo build --release --target "$TARGET"
          tar --owner=0 --group=0 --numeric-owner -czf "twig-$TARGET.tar.gz" -C "target/$TARGET/release" twig

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "twig-$TARGET.tar.gz" --title "$GITHUB_REF_NAME" --generate-notes
