[package]
name = "twig"
version = "0.2.0"
edition = "2021"
description = "One worktree per branch, one CLion window per worktree"
license = "MIT"
repository = "https://github.com/matsvbelle/twig"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha1 = "0.10"
png = "0.17"
libc = "0.2"
self_update = { version = "1.3", default-features = false, features = [
    "github",
    "ureq",
    "rustls",
    "compression-tar-gz",
    "checksums",
] }
tempfile = "3"

# Small, optimized single binary (matches the wessh release profile).
[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
